name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files
        run: |
          mkdir -p TempMail/Assets.xcassets/AppIcon.appiconset
          mv *.swift TempMail/
          mv icon-1024.png TempMail/Assets.xcassets/AppIcon.appiconset/
          echo '{"info":{"author":"xcode","version":1}}' > TempMail/Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"icon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > TempMail/Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project TempMail.xcodeproj -scheme TempMail \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/TempMail.app Payload/
          zip -qry TempMail.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TempMail-ipa
          path: TempMail.ipa
